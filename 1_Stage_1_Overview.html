cussion and Analysis |\n| MG&A | Marketing, general, and administrative |\n| NAND | NAND flash memory |\n| NEX | Networking and Edge operating segment |\n| nm | Nanometer |\n| R&D | Research and development |\n| RSU | Restricted stock unit |\n| SEC | US Securities and Exchange Commission |\n| SoC | A system on a chip, which integrates most of the components of a computer or other electronic system into a single silicon chip. We offer a range of SoC products in CCG, DCAI, and NEX. In our DCAI and NEX businesses, we offer SoCs across many market segments for a variety of applications, including products targeted for 5G base stations and network infrastructure |\n| Tower | Tower Semiconductor Ltd |\n| US | United States |"}, {"ticker": "NVDA", "sub_type": "10-Q", "publication_date": "2019-05-16T20:36:34+00:00", "ai_category": 1, "ai_category_label": "AI Partnership", "ai_materiality_score": 1, "ai_saliency_score": 0, "snippet": "### ZiiLabs 1 Patents Lawsuit  On October 2, 2017, ZiiLabs Inc\\., Ltd\\., or ZiiLabs, a non\\-practicing entity, filed a complaint in the United States District Court for the District of Delaware alleging that NVIDIA had infringed and was continuing to infringe four U\\.S\\. patents...", "full_text": "### ZiiLabs 1 Patents Lawsuit\n\nOn October 2, 2017, ZiiLabs Inc\\., Ltd\\., or ZiiLabs, a non\\-practicing entity, filed a complaint in the United States District Court for the District of Delaware alleging that NVIDIA had infringed and was continuing to infringe four U\\.S\\. patents relating to GPUs, or the ZiiLabs 1 Patents\\. ZiiLabs is a Bermuda corporation and a wholly\\-owned subsidiary of Creative Technology Asia Limited, a Hong Kong company which is itself is a wholly\\-owned subsidiary of Creative Technology Ltd\\., a publicly traded Singapore company\\. The complaint sought unspecified monetary damages, enhanced damages, interest, costs, and fees against NVIDIA and an injunction against further direct or indirect infringement of the ZiiLabs 1 Patents\\.\n\nOn February 22, 2018, the Delaware Court stayed the ZiiLabs 1 case pending the resolution of the U\\.S\\. International Trade Commission, or USITC, investigation over the ZiiLabs 2 patents\\.\n\nOn February 1, 2019, NVIDIA entered into an agreement in which it received a license to the ZiiLabs patents and a dismissal of the ZiiLabs 1 and 2 Patent Lawsuits, which had an immaterial impact on our financial results\\. The ZiiLabs 1 and 2 district court cases were dismissed pursuant to a stipulation of dismissal filed on February 8, 2019\\. The Administrative Law Judge issued an Initial Determination on February 12, 2019, granting the motion to terminate the USITC investigation addressing the ZiiLabs 2 patents\\.\n\n**NVIDIA CORPORATION AND SUBSIDIARIES**\n\n### NOTES TO CONDENSED CONSOLIDATED FINANCIAL STATEMENTS (Continued)\n\n### (Unaudited)\n\n### ZiiLabs 2 Patents Lawsuits"}, {"ticker": "INTC", "sub_type": "10-K", "publication_date": "2020-01-23T23:39:55+00:00", "ai_category": 6, "ai_category_label": "Product Roadmap", "ai_materiality_score": 1, "ai_saliency_score": 0, "snippet": "functions and monitoring roadway conditions for an entire trip. For a defined use case (e.g., urban driving), no driver intervention is required at all | | (L5) Level 5 | The system performs all aspects of the driving task under all roadway and environmental conditions. System...", "full_text": "functions and monitoring roadway conditions for an entire trip. For a defined use case (e.g., urban driving), no driver intervention is required at all |\n| (L5) Level 5 | The system performs all aspects of the driving task under all roadway and environmental conditions. System performance is equal to a human driver in every scenario, including extreme environments |\n| MaaS | Mobility-as-a-Service |\n| McAfee | Business, post divestiture of ISecG in Q2 2017, which we retained an interest in as part of our investment strategy |\n| MD&A | Management's Discussion & Analysis |\n U.S. GAAP | U.S. Generally Accepted Accounting Principles |\n| U.S. Pension Plan | U.S. Intel Minimum Pension Plan |\n| U.S. Retiree Medical Plan | U.S. Postretirement Medical Benefits Plan |\n| VPU | Vision processing unit |\n| Wind River | Wind River Systems, Inc. (divested in Q2 2018) |\n| xPU | A term for processors that are designed for one of four major computing architectures: CPU, GPU, AI accelerator, and FPGA |"}, {"ticker": "NVDA", "sub_type": "10-Q", "publication_date": "2024-11-20T21:31:22+00:00", "ai_category": 1, "ai_category_label": "AI Partnership", "ai_materiality_score": 1, "ai_saliency_score": 0, "snippet": "The plaintiffs in the putative securities class action lawsuit, captioned 4:18\\-cv\\-07669\\-HSG, initially filed on December 21, 2018 in the United States District Court for the Northern District of California, and titled In Re NVIDIA Corporation Securities Litigation, filed an...", "full_text": "The plaintiffs in the putative securities class action lawsuit, captioned 4:18\\-cv\\-07669\\-HSG, initially filed on December 21, 2018 in the United States District Court for the Northern District of California, and titled In Re NVIDIA Corporation Securities Litigation, filed an amended complaint on May 13, 2020\\. The amended complaint asserted that NVIDIA and certain NVIDIA executives violated Section 10\\(b\\) of the Securities Exchange Act of 1934, as amended, or the Exchange Act, and SEC Rule 10b\\-5, by making materially false or misleading statements related to channel inventory and the impact of cryptocurrency mining on GPU demand between May 10, 2017 and November 14, 2018\\. Plaintiffs also alleged that the NVIDIA executives who they named as defendants violated Section 20\\(a\\) of the Exchange Act\\. Plaintiffs sought class certification, an award of unspecified compensatory damages, an award of reasonable costs and expenses, including attorneys\u2019 fees and expert fees, and further relief as the Court may deem just and proper\\. On March 2, 2021, the district court granted NVIDIA\u2019s motion to dismiss the complaint without leave to amend, entered judgment in favor of NVIDIA and closed the case\\. On March 30, 2021, plaintiffs filed an appeal from judgment in the United States Court of Appeals for the Ninth Circuit, case number 21\\-15604\\. On August 25, 2023, a majority of a three\\-judge Ninth Circuit panel affirmed in part and reversed in part the district court\u2019s dismissal of the case, with a third judge dissenting on the basis that the district court did not err in dismissing the case\\. On November 15, 2023, the Ninth Circuit denied NVIDIA\u2019s petition for rehearing  *en banc*  of the Ninth Circuit panel\u2019s majority decision to reverse in part the dismissal of the case, which NVIDIA had filed on October 10, 2023\\. On November 21, 2023, NVIDIA filed a motion with the Ninth Circuit for a stay of the mandate pending NVIDIA\u2019s petition for a writ of certiorari in the Supreme"}], "saliency_top": [{"ticker": "NVDA", "sub_type": "10-K", "publication_date": "2025-02-26T21:48:33+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 9, "ai_saliency_score": 3, "snippet": "**Our Markets**  We specialize in markets where our computing platforms can provide tremendous acceleration for applications\\. These platforms incorporate processors, interconnects, software, algorithms, systems, and services to deliver unique value\\. Our platforms address four...", "full_text": "**Our Markets**\n\nWe specialize in markets where our computing platforms can provide tremendous acceleration for applications\\. These platforms incorporate processors, interconnects, software, algorithms, systems, and services to deliver unique value\\. Our platforms address four large markets where our expertise is critical: Data Center, Gaming, Professional Visualization, and Automotive\\.\n\n**Data Center**\n\nThe NVIDIA Data Center platform is focused on accelerating the most compute\\-intensive workloads, such as AI, data analytics, graphics, and scientific computing, delivering significantly better performance and power efficiency relative to conventional CPU\\-only approaches\\. It is deployed in cloud, hyperscale, on\\-premises and edge data centers\\. The platform consists of compute and networking offerings typically delivered to customers as systems, subsystems, or modules, along with software and services\\.\n\nOur compute offerings include supercomputing platforms and servers, bringing together our energy efficient GPUs, CPUs, interconnects, and fully optimized AI and HPC software stacks\\. In addition, they include NVIDIA AI Enterprise software; our DGX Cloud service; and a growing body of acceleration libraries, APIs, SDKs, and domain\\-specific application frameworks\\.\n\nOur networking offerings include end\\-to\\-end platforms for InfiniBand and Ethernet, consisting of network adapters, cables, DPUs, switch chips and systems, as well as a full software stack\\. This has enabled us to architect data center\\-scale computing platforms that can interconnect thousands of compute nodes with high\\-performance networking\\. While historically the server was the unit of computing, as AI and HPC workloads have become extremely large spanning thousands of compute nodes, the data center has become the new unit of computing, with networking as an integral part\\."}, {"ticker": "DELL", "sub_type": "10-Q", "publication_date": "2026-06-09T20:11:41+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 9, "ai_saliency_score": 3, "snippet": "**INTRODUCTION**  **Company Overview**  Dell Technologies is a leader in the global technology industry focused on providing broad and innovative technology solutions for the data and artificial intelligence \\(\u201cAI\u201d\\) era\\. We build and offer solutions ranging from client devices...", "full_text": "**INTRODUCTION**\n\n**Company Overview**\n\nDell Technologies is a leader in the global technology industry focused on providing broad and innovative technology solutions for the data and artificial intelligence \\(\u201cAI\u201d\\) era\\. We build and offer solutions ranging from client devices and peripherals to infrastructure solutions across servers, networking, and storage to meet the evolving needs of our customers and drive better business outcomes\\. With our extensive portfolio and our commitment to innovation, we offer secure, integrated solutions that extend from the edge to the core to the cloud, and we are at the forefront of AI, software\\-defined, and cloud native infrastructure solutions\\. Our vision is to become the most essential technology partner\\. We intend to realize our vision by executing our strategy of leveraging our strengths to extend our leadership positions and capture new growth\\.\n\nWe are organized into two business units which are also our reportable segments: Infrastructure Solutions Group and Client Solutions Group\\.\n\n### Infrastructure Solutions Group (\u201cISG\u201d)\n\n \u2014 We provide a comprehensive portfolio of advanced infrastructure solutions designed to help customers simplify, streamline, and automate information technology \\(\u201cIT\u201d\\) operations\\. ISG also offers software, peripherals, and services, including consulting and support and deployment\\. Our major product categories within ISG include our AI\\-optimized servers offerings, our traditional servers and networking offerings, and our storage offerings\\.\n\n\u2022\n\n### AI-optimized servers\n\n \u2014 We offer a specialized portfolio of AI\\-optimized servers designed to handle the most demanding compute\\-intensive workloads, including AI model training, fine\\-tuning, and inferencing\\.\n\n\u2022\n\n### Traditional servers and networking"}, {"ticker": "NVDA", "sub_type": "10-Q", "publication_date": "2017-11-21T21:25:20+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 8, "ai_saliency_score": 3, "snippet": "GPU business revenue was   ### $2.22 billion  , up 31% from a year earlier and up 17% sequentially, with strength across all platforms, including gaming, datacenter, and professional visualization\\. GeForce GPU gaming revenue of $1\\.56 billion was led by continued strong...", "full_text": "GPU business revenue was \n\n### $2.22 billion\n\n, up 31% from a year earlier and up 17% sequentially, with strength across all platforms, including gaming, datacenter, and professional visualization\\. GeForce GPU gaming revenue of $1\\.56 billion was led by continued strong adoption of Pascal\\-based GeForce GTX gaming platforms\\. Datacenter revenue \\(including Tesla, NVIDIA GRID and DGX\\) was $501 million, up 109% year on year and up 20% sequentially, reflecting shipments of our Volta GPU architecture\\. Datacenter growth was fueled by strong demand by hyperscale and cloud customers for deep learning training and accelerated GPU computing, as well as demand for HPC, DGX AI supercomputing, and GRID virtualization platforms\\. Professional visualization revenue grew 15% year over year and 2% sequentially to $239 million, led by high\\-end mobile platforms\\.\n\nTegra processor business revenue was $419 million, up 74% from a year ago and up 26% sequentially\\. Tegra processor business revenue includes system\\-on\\-a\\-chip \\(SOCs\\) modules for the Nintendo Switch gaming console and development services\\. Also included was automotive revenue of $144 million, which was up 13% from a year earlier and up 1% sequentially, incorporating infotainment modules, production DRIVE PX platforms, and development agreements for self\\-driving cars\\.\n\nRevenue from our patent license agreement with Intel concluded in the first quarter of fiscal year 2018\\.\n\nGross margin for the  third quarter of fiscal  year  2018  was  59\\.5% , increasing from the prior year and the previous quarter due to strong growth in datacenter revenue and the mix within our GeForce gaming GPUs\\.\n\nOperating expenses for the  third quarter of fiscal  year  2018  were  $674 million , up  24%  from a year earlier and up  10%  sequentially, reflecting increased headcount and related costs for our growth initiatives \\- gaming, artificial intelligence, and autonomous driving\\."}, {"ticker": "NVDA", "sub_type": "10-K", "publication_date": "2018-02-28T21:31:19+00:00", "ai_category": 6, "ai_category_label": "Product Roadmap", "ai_materiality_score": 8, "ai_saliency_score": 3, "snippet": "**Automotive**  NVIDIA\u2019s Automotive market is comprised of infotainment solutions, advanced driver assistance systems, and AV opportunities\\. Leveraging our technology leadership in AI and building on its long\\-standing automotive relationships, we are delivering a full solution...", "full_text": "**Automotive**\n\nNVIDIA\u2019s Automotive market is comprised of infotainment solutions, advanced driver assistance systems, and AV opportunities\\. Leveraging our technology leadership in AI and building on its long\\-standing automotive relationships, we are delivering a full solution for the AV market under the DRIVE brand\\. NVIDIA has demonstrated multiple applications of AI within the car\\. AI can drive the car itself as a pilot, in either partial or fully autonomous mode\\. AI can also be a co\\-pilot, assisting the human driver in creating a safer driving experience\\.\n\nNVIDIA is working with over 320 automakers, tier\\-one suppliers, automotive research institutions, HD mapping companies, and startups to develop and deploy AI systems for self\\-driving vehicles\\. Our unified AI computing architecture starts with mapping and training deep neural networks using our Tesla GPUs, and then running them within the vehicle on the NVIDIA DRIVE AI car computing platform\\. This end\\-to\\-end approach leverages NVIDIA DriveWorks software and allows cars to receive over\\-the\\-air updates to add new features and capabilities throughout the life of a vehicle\\.\n\nDRIVE PX can understand in real\\-time what's happening around the vehicle, precisely locate itself on an HD map, and plan a safe path forward\\. This advanced self\\-driving car platform combines deep learning, sensor fusion, and surround vision to change the driving experience\\. Our DRIVE PX platform scales from a palm\\-sized, energy\\-efficient module for AutoCruise automated highway\\-driving capabilities to a configuration with multiple systems aimed at enabling driverless cars\\. A new single\\-processor configuration of DRIVE PX enables vehicles to use deep neural networks to process data from multiple cameras and sensors\\.\n\n**Business Strategies**\n\n### NVIDIA\u2019s key strategies that shape our overall business approach include:"}, {"ticker": "NVDA", "sub_type": "10-Q", "publication_date": "2026-08-26T20:36:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 9, "ai_saliency_score": 3, "snippet": "**Overview**  **Our Company and Our Businesses**  NVIDIA pioneered accelerated computing to help solve the most challenging computational problems\\. Since our original focus on PC graphics, we have expanded to several other large and important computationally intensive fields\\....", "full_text": "**Overview**\n\n**Our Company and Our Businesses**\n\nNVIDIA pioneered accelerated computing to help solve the most challenging computational problems\\. Since our original focus on PC graphics, we have expanded to several other large and important computationally intensive fields\\. Fueled by the sustained demand for exceptional 3D graphics and the scale of the gaming market, NVIDIA has leveraged its GPU architecture to create platforms for scientific computing, AI, data science, autonomous vehicles, robotics, and digital twin applications\\. NVIDIA is now a data center\\-scale AI infrastructure company reshaping all industries\\.\n\nOur two operating segments are \u201cCompute & Networking\u201d and \u201cGraphics\\.\u201d Refer to Note 13 of the Notes to Condensed Consolidated Financial Statements in Part I, Item 1 of this Quarterly Report on Form 10\\-Q for additional information\\.\n\nHeadquartered in Santa Clara, California, NVIDIA was incorporated in California in April 1993 and reincorporated in Delaware in April 1998\\.\n\n### Recent Developments, Future Objectives and Challenges\n\nRevenue growth in the second quarter and the first half of fiscal year 2027 was driven by data center products for accelerated computing and AI solutions\\. Blackwell continued to account for the majority of our system shipments\\."}], "saliency_bottom": [{"ticker": "INTC", "sub_type": "10-K", "publication_date": "2026-01-22T23:43:06+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 7, "ai_saliency_score": -3, "snippet": "We are subject to numerous risks associated with the evolving market for products with AI capabilities\\.  The markets and use cases for products with AI capabilities have been rapidly evolving, are difficult to predict, and may impact demand for our products\\. For example, in...", "full_text": "We are subject to numerous risks associated with the evolving market for products with AI capabilities\\.\n\nThe markets and use cases for products with AI capabilities have been rapidly evolving, are difficult to predict, and may impact demand for our products\\. For example, in the last few years, the demand for high\\-end GPUs for model training increased dramatically and has resulted and may continue to result in a significant shift in data center customer spend\\. The investments we have made and expect to continue to make to develop products and software to address what we believe will be increasing demand for AI capabilities, most notably in AI PCs but also in the data center and in GPUs, may be insufficient, and we face significant hurdles, including whether demand will materialize, whether third\\-party developers will develop the software to utilize the AI capabilities of our products, and whether we will be successful in developing products that can compete with the more established offerings and ecosystems of our competitors\\. In addition, many of our competitors have substantially greater financial resources than us, are making substantially greater investments in AI than we are, including through internal development and through acquisitions and hiring and retention of talent, and are further along in their development of AI technologies than we are\\."}, {"ticker": "NVDA", "sub_type": "10-K", "publication_date": "2026-02-25T21:42:19+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 8, "ai_saliency_score": -3, "snippet": "For example, the USG already imposed license conditions that limit the ability of foreign firms to create and offer as a service large\\-scale GPU clusters, such as imposing license conditions on the use of products to be exported to certain countries, and may impose additional...", "full_text": "For example, the USG already imposed license conditions that limit the ability of foreign firms to create and offer as a service large\\-scale GPU clusters, such as imposing license conditions on the use of products to be exported to certain countries, and may impose additional conditions such as requiring chip tracking and throttling mechanisms that could disable or impair GPUs if certain events, including unauthorized system configuration, use, or location, are detected\\. Such government mandates in chip designs could introduce system vulnerabilities and expose us to significant risk and potential liability, negatively impact demand for our products, and could have a material impact on our business, operating results, and financial condition\\. Even if not enacted into binding legislation, draft bills have impacted and may in the future negatively impact our business\\. For example, following U\\.S\\. legislative proposals calling for mandatory features in our chips, China\u2019s government publicly questioned whether our H20 products have built\\-in vulnerabilities, discouraging customers from purchasing our products\\. We provided a public response explaining that our GPUs, including H20, do not include such built\\-in vulnerabilities, and will respond to any follow\\-up questions we receive\\.\n\nOpen\\-source foundation models are rapidly growing in popularity with developers worldwide\\. Any regulatory control or other restriction that limits our ability to provide products and services that support third\\-party applications and models, including applications built on foundation models originating in China such as DeepSeek, Qwen, or KIMMI, could have a material impact on our business, operating results, and financial condition\\.\n\nThe USG already imposed export controls restricting certain gaming GPUs, and if the USG expands such controls to restrict additional gaming products, it may disrupt a significant portion of our supply and distribution chain and"}, {"ticker": "NVDA", "sub_type": "10-Q", "publication_date": "2023-08-25T23:36:34+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 9, "ai_saliency_score": -3, "snippet": "Increasing use of economic sanctions and export controls may also impact demand for our products or services, negatively impacting our business and financial results\\. Additional unilateral or multilateral controls are also likely to include deemed export control limitations...", "full_text": "Increasing use of economic sanctions and export controls may also impact demand for our products or services, negatively impacting our business and financial results\\. Additional unilateral or multilateral controls are also likely to include deemed export control limitations that negatively impact the ability of our research and development teams to execute our roadmap or other objectives in a timely manner\\. Additional export restrictions may not only impact our ability to serve overseas markets, but also provoke responses from foreign governments, including China, that negatively impact our supply chain or our ability to provide our products and services to customers in all markets worldwide, which could also substantially reduce our revenue\\.\n\nDuring the third quarter of fiscal year 2023, the USG announced export restrictions and export licensing requirements targeting China\u2019s semiconductor and supercomputing industries\\. These restrictions impact exports of certain chips, as well as software, hardware, equipment, and technology used to develop, produce, and manufacture certain chips, to China \\(including Hong Kong and Macau\\) and Russia, and specifically impact our A100 and H100 integrated circuits, DGX or any other systems or boards which incorporate A100 or H100 integrated circuits\\. The license requirements also apply to any future NVIDIA integrated circuit achieving certain peak performance and chip\\-to\\-chip I/O performance thresholds, as well as any system or board that includes those circuits\\. There are also now licensing requirements to export a wide array of products, including networking products, destined for certain end users and for certain end uses in China\\. During the second quarter of fiscal year 2024, the USG also informed us of an additional licensing requirement for a subset of A100 and H100 products destined to certain customers and other regions, including some countries in the Middle East\\."}, {"ticker": "NVDA", "sub_type": "10-Q", "publication_date": "2023-08-25T23:36:34+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 9, "ai_saliency_score": -3, "snippet": "controls restricting our ability to sell datacenter GPUs may also negatively impact demand for our networking products used in servers containing our GPUs\\. The USG may also impose export controls on our networking products, such as high\\-speed network interconnects, to limit...", "full_text": "controls restricting our ability to sell datacenter GPUs may also negatively impact demand for our networking products used in servers containing our GPUs\\. The USG may also impose export controls on our networking products, such as high\\-speed network interconnects, to limit the ability of downstream parties to create large clusters for frontier model training\\. Any new control that impacts a wide range of our products, including but not limited to A800, H800, and gaming products would likely have a disproportionate impact on NVIDIA and may disadvantage us against certain of our competitors that sell chips that are outside the scope of such control\\. Excessive or shifting export controls may also encourage customers outside China and other impacted regions to \u201cdesign\\-out\u201d U\\.S\\. semiconductors from their products to reduce the compliance burden and risk, and to ensure that they are able to serve markets worldwide\\. As a result, excessive or shifting export controls may negatively impact demand for our products and services not only in China, but also in other markets, such as Europe, Latin America, and Southeast Asia\\. Excessive or shifting export controls increase the risk of investing in U\\.S\\. advanced semiconductor products, because by the time a new product is ready for market, it may be subject to new unilateral export controls restricting its sale\\. At the same time, such controls may increase investment in foreign competitors, which would be less likely to be restricted by U\\.S\\. controls\\."}, {"ticker": "NVDA", "sub_type": "10-Q", "publication_date": "2025-05-28T20:32:57+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 9, "ai_saliency_score": -3, "snippet": "Over the past three years, we have been subject to a series of shifting and expanding export control restrictions, impacting our ability to serve customers outside the United States\\.  During the third quarter of fiscal year 2023, the USG announced export restrictions and export...", "full_text": "Over the past three years, we have been subject to a series of shifting and expanding export control restrictions, impacting our ability to serve customers outside the United States\\.\n\nDuring the third quarter of fiscal year 2023, the USG announced export restrictions and export licensing requirements targeting China\u2019s semiconductor and supercomputing industries\\. These restrictions impacted exports of certain chips, as well as software, hardware, equipment and technology used to develop, produce and manufacture certain chips to China \\(including Hong Kong and Macau\\) and Russia, and specifically impact our A100 and H100 integrated circuits, DGX or any other systems or boards which incorporate A100 or H100 integrated circuits\\. During the second quarter of fiscal year 2024, the USG also informed us of an additional licensing requirement for a subset of A100 and H100 products destined to certain customers and other regions, including some countries in the Middle East\\.\n\nDuring the third quarter of fiscal year 2024, the USG announced new and updated licensing requirements for exports to China and Country Groups D1, D4, and D5 \\(including but not limited to, Saudi Arabia, the United Arab Emirates, and Vietnam, but excluding Israel\\) of our products exceeding certain performance thresholds, including, but not limited to, the A100, A800, H100, H800, L4, L40, L40S RTX 4090, GB200 NVL72, and B200\\. The licensing requirements also apply to the export of products exceeding certain performance thresholds to a party headquartered in, or with an ultimate parent headquartered in, Country Group D5, including China\\."}]}, {"key": "transcripts", "label": "Earnings Call Transcripts", "stage_1_title": "1 - Dynamic RAG AI Classification (Haiku 4.5)", "stage_1_pruned": true, "sub_type_scope": ["earnings_call"], "description": {"source": "stockanalysis.c 62, "ai_relevant": 494, "pct": 36.3}, {"ticker": "CAT", "considered": 501, "ai_relevant": 41, "pct": 8.2}, {"ticker": "DELL", "considered": 541, "ai_relevant": 324, "pct": 59.9}, {"ticker": "INTC", "considered": 1373, "ai_relevant": 361, "pct": 26.3}, {"ticker": "MU", "considered": 1305, "ai_relevant": 385, "pct": 29.5}, {"ticker": "NVDA", "considered": 1572, "ai_relevant": 979, "pct": 62.3}, {"ticker": "PG", "considered": 594, "ai_relevant": 12, "pct": 2.0}, {"ticker": "TEAM", "considered": 704, "ai_relevant": 184, "pct": 26.1}, {"ticker": "WM", "considered": 859, "ai_relevant": 17, "pct": 2.0}], "materiality_top": [{"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2024-11-20T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 10, "ai_saliency_score": 3, "snippet": "Blackwell demand is staggering, and we are racing to scale supply to meet the incredible demand customers are placing on us.  Customers are gearing up to deploy Blackwell at scale.  Oracle announced the world's first Zettascale AI cloud computing clusters that can scale to over...", "full_text": "Blackwell demand is staggering, and we are racing to scale supply to meet the incredible demand customers are placing on us.\n\nCustomers are gearing up to deploy Blackwell at scale.\n\nOracle announced the world's first Zettascale AI cloud computing clusters that can scale to over 131,000 Blackwell GPUs to help enterprises train and deploy some of the most demanding next-generation AI models.\n\nYesterday, Microsoft announced they will be the first CSP to offer in private preview Blackwell-based cloud instances powered by NVIDIA GB200 and Quantum InfiniBand.\n\nLast week, Blackwell made its debut on the most recent round of MLPerf training results, sweeping the Perf GPU benchmarks and delivering a 2.2x leap in performance over Hopper.\n\nThe results also demonstrate our relentless pursuit to drive down the cost of compute.\n\nJust 64 Blackwell GPUs are required to run the GPT-3 benchmark compared to 256 H100s for a 4x reduction in cost.\n\nNVIDIA Blackwell architecture with NVLink switch enables up to 30x faster inference performance and a new level of inference scaling throughput and response time that is excellent for running new reasoning inference applications like OpenAI's o1 model.\n\nWith every new platform shift, a wave of startups is created.\n\nHundreds of AI-native companies are already delivering AI services with great success.\n\nThough Google, Meta, Microsoft, and OpenAI are the headliners, and Anthropic, Perplexity, Mistral, Adobe Firefly, Runway, Midjourney, Lightricks, Harvey, Codeium, Cursor, and Bridge are seeing great success while thousands of AI-native startups are building new services.\n\nThe next waves of AI are enterprise AI and industrial AI.\n\nEnterprise AI is in full throttle.\n\nNVIDIA AI Enterprise, which includes NVIDIA NeMo and NIM microservices, is an operating platform of agentic AI.\n\nIndustry leaders are using NVIDIA AI to build copilots and agents."}, {"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2023-08-23T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 10, "ai_saliency_score": 3, "snippet": "The easiest way to think about the demand is the world is transitioning from general purpose computing to accelerated computing.  That's the easiest way to think about the demand.  The best way for companies to increase their throughput, improve their energy efficiency, improve...", "full_text": "The easiest way to think about the demand is the world is transitioning from general purpose computing to accelerated computing.\n\nThat's the easiest way to think about the demand.\n\nThe best way for companies to increase their throughput, improve their energy efficiency, improve their cost efficiency, is to divert their capital budget to accelerated computing and generative AI.\n\nBy doing that, you're gonna offload so much workload off of the CPUs, that the available CPUs is in your data center will get boosted.\n\nWhat you're seeing companies do now is recognizing this, this, the tipping point here, re-recognizing the beginning of this transition, and diverting their capital investment to accelerated computing and generative AI.\n\nThat's, that's probably the easiest way to think about the opportunity ahead of us.\n\nThis isn't a, a singular application that, that is driving the demand, but this is a new computing platform, if you will, a new computing transition that's happening.\n\nData centers all over the world are responding to this and shifting, you know, in a broad-based way.\n\n### Operator\n\nOkay, next, we go to Toshiya Hari with Goldman Sachs.\n\nYour line is now open.\n\n### Toshiya Hari (Managing Director and Senior Equity Research Analyst, Goldman Sachs)\n\nHi, thank you for taking the question.\n\nI had one quick clarification question for Colette, and then another one for, for Jensen.\n\nColette, I think last quarter you had said, CSPs were about 40% of your data center revenue, consumer internet, 30%, enterprise, 30%.\n\nBased on your remarks, it sounded like CSPs and consumer internet may have been a larger percentage of your business.\n\nIf you can kinda clarify that or confirm that, that would be super helpful.\n\nThen, Jensen, a, a question for you."}, {"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2024-08-28T00:00:00+00:00", "ai_category": 6, "ai_category_label": "Product Roadmap", "ai_materiality_score": 10, "ai_saliency_score": 3, "snippet": "These are very capital-intensive infrastructures.  Customers want to deploy it as soon as they get their hands on the equipment and deliver the best performance and TCO.  Blackwell provides three to five times more AI throughput in a power-limited data center than Hopper.  The...", "full_text": "These are very capital-intensive infrastructures.\n\nCustomers want to deploy it as soon as they get their hands on the equipment and deliver the best performance and TCO.\n\nBlackwell provides three to five times more AI throughput in a power-limited data center than Hopper.\n\nThe third is NVLink.\n\nThis is a very big deal with its all-to-all GPU switch is game-changing.\n\nThe Blackwell system lets us connect a hundred and forty-four GPUs in seventy-two GB200 packages into one NVLink domain, with an aggregate NVLink bandwidth of two hundred and fifty-nine terabytes per second in one rack.\n\nJust put that in perspective, that's about ten times higher than Hopper.\n\nTwo hundred and fifty-nine terabytes per second kind of makes sense because you need to boost the training of multi-trillion parameter models on trillions of tokens.\n\nAnd so that natural amount of data needs to be moved around from GPU to GPU.\n\nFor inference, NVLink is vital for low latency, high throughput, large language model, token generation.\n\nWe now have three networking platforms: NVLink for GPU scale-up, Quantum InfiniBand for supercomputing and dedicated AI factories, and Spectrum-X for AI on Ethernet.\n\nNVIDIA's networking footprint is much bigger than before. generative AI momentum is accelerating.\n\ngenerative AI frontier model makers are racing to scale to the next AI plateau to increase model safety and IQ.\n\nWe're also scaling to understand more modalities, from text, images, and video to 3D, physics, chemistry, and biology.\n\nChatbots, coding AIs, and image generators are growing fast, but it's just the tip of the iceberg.\n\nInternet services are deploying generative AI for large-scale recommenders, ad targeting, and search systems.\n\nAI startups are consuming tens of billions of dollars yearly of CSP's cloud capacity, and countries are recognizing the importance of AI and investing in sovereign AI infrastructure.\n\nAnd NVIDIA AI, NVIDIA Omniverse is opening up the next era of AI, general robotics."}, {"ticker": "MU", "sub_type": "earnings_call", "publication_date": "2026-03-18T00:00:00+00:00", "ai_category": 6, "ai_category_label": "Product Roadmap", "ai_materiality_score": 10, "ai_saliency_score": 3, "snippet": "AI server demand continues to be strong. Both AI and traditional server demand are constrained by lack of adequate DRAM and NAND supply.  We expect server units to grow in the low teens % range in calendar 2026, driven by growth in both AI and traditional servers.  We expect...", "full_text": "AI server demand continues to be strong. Both AI and traditional server demand are constrained by lack of adequate DRAM and NAND supply.\n\nWe expect server units to grow in the low teens % range in calendar 2026, driven by growth in both AI and traditional servers.\n\nWe expect server DRAM content to continue to grow in calendar 2026 with the introduction of new platforms.\n\nAt NVIDIA's GTC, we announced that Micron has begun volume shipment of its HBM4 36 GB 12-high in the first quarter of calendar year 2026 and is designed for NVIDIA Rubin .\n\nWith our HBM4 production ramp and volume shipments underway, we expect to reach mature yields faster than HBM3E.\n\nWe have also sampled our HBM4 16-high product, which provides 48 GB of HBM capacity in each HBM cube, a 33% increase in HBM capacity compared to HBM4 12-high.\n\nDevelopment of HBM4E, our next generation HBM product, is well underway, and we expect to ramp volume in calendar 2027.\n\nOur HBM4E will leverage Micron's production-proven, industry-leading, 1-gamma DRAM technology node and is set to deliver another step function improvement in performance, enabling a whole new generation of AI compute platforms across the industry.\n\nAdditionally, HBM4E customization options offer us further differentiation opportunities and even deeper R&D engagement with customers.\n\nMicron pioneered the development of LPDRAM for the data center, which consumes one third the power of DDR DRAM server modules.\n\nBuilding on this leadership, we sampled the industry's first 256 GB LPCAMM2 product, which is built using our 1-gamma node and enables a massive 2 TB of capacity per CPU, quadrupling the content from just a year ago.\n\nWe see expanding use of LPDRAM in the data center in the years ahead, and we are excited to maintain an industry-leading innovative product roadmap in this market.\n\nRapid growth in AI inference is driving the emergence of new architectures optimized for the token economics of specific workloads."}, {"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2023-08-23T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 10, "ai_saliency_score": 3, "snippet": "All our statements are made as of today, August 23rd, 2023, based on information currently available to us.  Except as required by law, we assume no obligation to update any such statements.  During this call, we will discuss non-GAAP financial measures.  You can find a...", "full_text": "All our statements are made as of today, August 23rd, 2023, based on information currently available to us.\n\nExcept as required by law, we assume no obligation to update any such statements.\n\nDuring this call, we will discuss non-GAAP financial measures.\n\nYou can find a reconciliation of these non-GAAP financial measures to GAAP financial measures in our CFO commentary, which is posted on our website.\n\nWith that, let me turn the call over to Colette.\n\n### Colette Kress (EVP and CFO, NVIDIA)\n\nThanks, Simona.\n\nWe had an exceptional quarter.\n\nRecord Q2 revenue of $13.51 billion was up 88% sequentially and up 101% year-on-year, and above our outlook of $11 billion.\n\nLet me first start with data center.\n\nRecord revenue of $10.32 billion was up 141% sequentially and up 171% year-on-year.\n\nData center compute revenue nearly tripled year-on-year, driven primarily by accelerating demand from cloud service providers and large consumer internet companies for our HGX platform, the engine of generative AI and large language models.\n\nMajor companies, including AWS, Google Cloud, Meta, Microsoft Azure, and Oracle Cloud, as well as a growing number of GPU cloud providers, are deploying in volume HGX systems based on our Hopper and Ampere architecture, Tensor Core GPUs.\n\nNetworking revenue almost doubled year-over-year, driven by our end-to-end InfiniBand networking platform, the gold standard for AI.\n\nThere is tremendous demand for NVIDIA accelerated computing and AI platforms.\n\nOur supply partners have been exceptional in ramping capacity to support our needs.\n\nOur data center supply chain, including HGX, with 35,000 parts and highly complex networking, has been built up over the past decade.\n\nWe have also developed and qualified additional capacity and suppliers for key steps in the manufacturing process, such as CoWoS packaging.\n\nWe expect supply to increase each quarter through next year."}], "materiality_bottom": [{"ticker": "MU", "sub_type": "earnings_call", "publication_date": "2025-12-17T00:00:00+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 1, "ai_saliency_score": 0, "snippet": "Thanks.  ### Mark Murphy (CFO, Micron Technology)  Thank you.  ### Timothy Arcuri (Analyst, UBS)  Thank you.  ### Operator  And I show our next question in the queue comes from the line of CJ Muse from Cantor Fitzgerald.  Please go ahead.  ### C.J. Muse (Senior Managing Director...", "full_text": "Thanks.\n\n### Mark Murphy (CFO, Micron Technology)\n\nThank you.\n\n### Timothy Arcuri (Analyst, UBS)\n\nThank you.\n\n### Operator\n\nAnd I show our next question in the queue comes from the line of CJ Muse from Cantor Fitzgerald.\n\nPlease go ahead.\n\n### C.J. Muse (Senior Managing Director and Analyst, Cantor Fitzgerald)\n\nBack to you.\n\nBack to you.\n\n### Operator\n\nCJ Muse, your line is open.\n\n### C.J. Muse (Senior Managing Director and Analyst, Cantor Fitzgerald)\n\nYeah, yeah.\n\nThey didn't answer the prior question.\n\n### Sanjay Mehrotra (CEO, Micron Technology)\n\nOperator?\n\n### Operator\n\nYes, sir.\n\n### Sanjay Mehrotra (CEO, Micron Technology)\n\nCan you turn it back to management so they can answer the prior question?\n\n### Operator\n\nSure.\n\nManagement's line is open.\n\nPlease proceed.\n\nI believe the speaker's lines are muted at this time.\n\nLadies and gentlemen, please continue to stand by.\n\nYour call will resume momentarily.\n\n### Mark Murphy (CFO, Micron Technology)\n\nOperator, can you hear us?\n\n### Operator\n\nYes, we can now.\n\nYou're unmuted, sir.\n\nPlease proceed.\n\n### Mark Murphy (CFO, Micron Technology)\n\nOkay.\n\nI'm not sure what happened there.\n\nWe were unmuted here.\n\nSo I just want to make sure that you heard Sanjay's response, correct?\n\n### Timothy Arcuri (Analyst, UBS)\n\nWe did not.\n\n### Mark Murphy (CFO, Micron Technology)\n\nYou did not hear Sanjay's response.\n\nOkay.\n\nThanks, Tim.\n\nSo Sanjay\u00e2\u0080\u0094\n\n### Timothy Arcuri (Analyst, UBS)\n\nWe heard\u00e2\u0080\u0094no, I heard Sanjay's response to the first question, but I didn't hear your response, Mark, to my question on CapEx and on capital intensity.\n\n### Mark Murphy (CFO, Micron Technology)\n\nOkay, Tim.\n\nOkay, Tim.\n\nThank you.\n\nSo you're right, Tim.\n\nWe're not providing a full-year revenue guide.\n\nWe did indicate that our CapEx was going up in calendar or in fiscal 2026.\n\nAnd a substantial part of that CapEx is to support DRAM and specifically HBM and the 1-gamma and 1-gamma ramp."}, {"ticker": "MU", "sub_type": "earnings_call", "publication_date": "2010-10-07T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 1, "ai_saliency_score": 0, "snippet": "Our next comes from Trenton Gera with Robert W. Baird.  Could you give us a little bit more details on the 40 2 nanometer transition and potential mix, we can expect, at end of fiscal 'eleven?  Sorry, I, we had a little trouble hearing you. I missed the second part of it, but...", "full_text": "Our next comes from Trenton Gera with Robert W. Baird.\n\nCould you give us a little bit more details on the 40 2 nanometer transition and potential mix, we can expect, at end of fiscal 'eleven?\n\nSorry, I, we had a little trouble hearing you. I missed the second part of it, but relative to 42 nanometer, transition on DRAM, I can tell you that we, you know, we As we said, we, we, we ran more 42 nanometers than we originally anticipated, last quarter and we're anticipating a ramp that will begin the quarter we're currently in. In one of our manufacturing fabs, we already have output in an Oterra that was, impressive, I think. I think everyone was happy with the early results out of 42 nanometer in in Ontario. So, you know, that's that's really a, probably a fiscal Q2 and beyond story from Micron, it will play out throughout the fiscal year.\n\nOkay. And any estimate in terms of the mix it could be by endofthisfiscalyear?\n\nIt kinda depends how we do at Innovara. That's a big piece of our total volume, but, you know, for the for the for the Micron facilities by the time we get to the end of the year, it'll actually be a mix of of 42. We'll have some 3 x in as well. And then, so that'll depend\n\nhow that goes. But I'd say, for\n\nthe Micron internal, it'll be, north of 50% And for Innoterra, it'll be in a similar range.\n\nOkay. And then, finally, if we assume a normal seasonal decline in pricing in cash over the next couple of quarters. Is that enough to, as an incentive for, smartphone OEMs, tablet OEMs to double alternative NAND Flash for next year, modeling production relative to what we're seeing in the second half. What do you feel that there is a need for a steeper decline curve in pricing for that to happen?\n\nLet me repeat that that for Mark. I think you had tough time understanding it.\n\nI think the question was based on\n\ndo you need additional pricing pressure in order for the stronger markets to double memory content next year. Did I get did I summarize that, right?"}, {"ticker": "MU", "sub_type": "earnings_call", "publication_date": "2014-01-07T00:00:00+00:00", "ai_category": 6, "ai_category_label": "Product Roadmap", "ai_materiality_score": 2, "ai_saliency_score": 0, "snippet": "Some of it goes into things around packaging technology and assembly technology that's allowing us to build these systems and solutions.  ### Glen Yeung (Analyst, Citigroup)  Okay, good.  Thank you.  ### Operator  Thank you.  Our next question comes from James Schneider from...", "full_text": "Some of it goes into things around packaging technology and assembly technology that's allowing us to build these systems and solutions.\n\n### Glen Yeung (Analyst, Citigroup)\n\nOkay, good.\n\nThank you.\n\n### Operator\n\nThank you.\n\nOur next question comes from James Schneider from Goldman Sachs.\n\nYour line's open.\n\nPlease go ahead, sir.\n\n### James Schneider (Analyst, Goldman Sachs)\n\nGood afternoon.\n\nThanks for taking my question.\n\nI was wondering if, now that Elpida is finally integrated, you could maybe give us a refresher on the amount of DRAM bits allocated to each of the PC mobile server and other specialty areas, if you would.\n\n### Kipp Bedard (VP of Investor Relations, Micron Technology)\n\nYep, we can do that.\n\nWould you like it on a revenue or bit basis?\n\n### James Schneider (Analyst, Goldman Sachs)\n\nBits would be great.\n\n### Kipp Bedard (VP of Investor Relations, Micron Technology)\n\nOkay.\n\nLet's see.\n\nOn a DRAM gigabyte basis, I'm just going to pick some of the bigger categories.\n\nPersonal systems where Q1 was about 40%, mobile was in the mid 30% range, server was in the mid-teens, the rest would be captured in networking and AIM.\n\n### James Schneider (Analyst, Goldman Sachs)\n\nGreat.\n\nThat's very helpful.\n\nThen maybe as a follow-up, I believe, and I may have not heard this right, that you talked about the Singapore fab reaching wafer capacity transition in the transition from DRAM to NAND.\n\nDid I hear that correctly?\n\nThen can you talk about when that might be fully transitioned at this point?\n\n### Kipp Bedard (VP of Investor Relations, Micron Technology)\n\nThat's right.\n\nWe were over 50% in the quarter completed, and the timing is still potentially variable, but I would look for that to complete out in the first half of the calendar year.\n\n### James Schneider (Analyst, Goldman Sachs)\n\nJust last one quickly for me would be on.\n\n### Kipp Bedard (VP of Investor Relations, Micron Technology)"}, {"ticker": "TEAM", "sub_type": "earnings_call", "publication_date": "2023-08-03T00:00:00+00:00", "ai_category": 3, "ai_category_label": "Restructuring", "ai_materiality_score": 2, "ai_saliency_score": 0, "snippet": "What are the considerations on, on that transition?  Thank you so much.  ### Scott Farquhar (Co-Founder and Co-CEO, Atlassian)  It's Scott here.  I just want to say a huge thank you to Cameron for his 11 years at Atlassian, and Cameron's done nearly every job at Atlassian.  He's...", "full_text": "What are the considerations on, on that transition?\n\nThank you so much.\n\n### Scott Farquhar (Co-Founder and Co-CEO, Atlassian)\n\nIt's Scott here.\n\nI just want to say a huge thank you to Cameron for his 11 years at Atlassian, and Cameron's done nearly every job at Atlassian.\n\nHe's done marketing, pre-sales, and now eventually, you know, worked his way up to running all of our, you know, sales and marketing, and he's done an incredible job.\n\nWhen we chatted about this, it's been, you know, the right time for Cameron to step back because the cloud migrations and end of life of server just are going so well.\n\nIt turns out that's, you know, the right time for Cameron to spend a bit more time skiing, given he was up in Tahoe at the moment.\n\nIn terms of what happens going forward, Cameron has some really strong leaders under him inside the business, particularly on the sales side.\n\nHe's got a leader that runs most of the sales organization at the moment, and so we expect there to be a strong continuity of that leadership.\n\nAt this stage, we're not saying exactly how that role will be replaced or refilled, but I don't expect there to be significant changes from what we've done in the past.\n\n### Operator\n\nYour next question comes from Gregg Moskowitz, from Mizuho Securities.\n\nPlease go ahead.\n\n### Gregg Moskowitz (Managing Director and Senior Enterprise Software Analyst, Mizuho Securities)\n\nOkay, thank you for taking the question, and best wishes to Cameron.\n\nFor Mike or Scott, you were very clear at, the Atlassian Summit in April that Atlassian Intelligence would be embedded in all of your cloud additions and be free of charge.\n\nSince that time, we've seen several software companies, GitLab, to name one of them, announce specific pricing for their GenAI tech.\n\nSo I'm curious to hear your thoughts on the direct monetization plans that are developing in the industry."}, {"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2017-05-09T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 2, "ai_saliency_score": 0, "snippet": "Of course, the first-party titles, the AAA titles are doing great.  Battlefield is doing great, I'm looking forward to the new Battlefield.  I'm looking forward to the new Star Wars, I'm looking forward to the first time that Destiny's coming to the PC.  As you know, it was a...", "full_text": "Of course, the first-party titles, the AAA titles are doing great.\n\nBattlefield is doing great, I'm looking forward to the new Battlefield.\n\nI'm looking forward to the new Star Wars, I'm looking forward to the first time that Destiny's coming to the PC.\n\nAs you know, it was a super hit on console.\n\nThe first generation Destiny wasn't available on PC.\n\nDestiny 2's coming to the PC, so I think the anticipation is pretty great.\n\nI would say that PC gaming continues to grow.\n\nIt's hard to imagine people around in another amazing world.\n\nI think people are going to be amazed at how long the alternate reality of the video game market is going to continue to expand.\n\n### Operator\n\nYour next question comes from the line of Vivek Arya from Merrill Lynch.\n\n### Vivek Arya (Analyst, Merrill Lynch)\n\nThanks for taking my question, and congratulations on the solid results and execution.\n\nJensen, for my first one, it's on the competitive landscape in your data center business.\n\nThere's been more noise around FPGA or CPU or ASIC solutions also chasing the same market.\n\nWhat do you think is NVIDIA's sustainable competitive advantage, and what role is CUDA playing in helping you maintain this lead in this business?\n\n### Jensen Huang (President and CEO, NVIDIA)\n\nYeah, Vivek, thanks for your question.\n\nFirst of all, it's really important to understand that the data centers, the cloud service providers, the internet companies, they all get kind of lumped together in one conversation.\n\nObviously, the way they use computers are very different.\n\nThere are three major pillars of computing up in the cloud or in large data centers, hyperscale.\n\nThe one pillar is just internal use of a computing system for developing, for training, for advancing artificial intelligence.\n\nThat's a high-performance computing problem.\n\nIt's a very complicated software problem.\n\nThe algorithms are changing all the time.\n\nThey're incredibly complicated."}], "saliency_top": [{"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2023-11-21T00:00:00+00:00", "ai_category": 6, "ai_category_label": "Product Roadmap", "ai_materiality_score": 8, "ai_saliency_score": 3, "snippet": "We put a lot of software-defined capabilities into the fabric, including computation.  We'll do floating-point calculations and computation right on the switch and right in the fabric itself.  So that's the reason why that difference in Ethernet versus InfiniBand, or InfiniBand...", "full_text": "We put a lot of software-defined capabilities into the fabric, including computation.\n\nWe'll do floating-point calculations and computation right on the switch and right in the fabric itself.\n\nSo that's the reason why that difference in Ethernet versus InfiniBand, or InfiniBand versus Ethernet for AI factories is so dramatic.\n\nAnd the difference is profound, and the reason for that is because you just invested in a $2 billion infrastructure for AI factories.\n\nA 20%, 25%, 30% difference in overall effectiveness, especially as you scale up, is measured in hundreds of millions of dollars of value.\n\nIf you were renting that infrastructure over the course of four to five years, it really, really adds up.\n\nSo InfiniBand's value proposition is undeniable for AI factories.\n\nHowever, as we move AI into enterprise, enterprise computing, what we'd like to enable every company to be able to build their own custom AIs.\n\nWe're building custom AIs in our company based on our proprietary data, our proprietary type of skills.\n\nFor example, recently we spoke about one of the models that we're creating, it's called ChipNeMo.\n\nWe're building many others.\n\nThere'll be, there'll be tens, hundreds of custom AI models that we create inside our company.\n\nAnd our company is, you know, for all of our employees, doesn't have to be as high performance as the AI factories we use to train the models.\n\nAnd so we would like the AI to be able to run in an Ethernet environment.\n\nAnd so what we've done is we invented this new platform that extends Ethernet, doesn't replace Ethernet, it's 100% compliant with Ethernet... and it's optimized for east-west traffic, which is where the computing fabric is.\n\nIt adds to Ethernet with an end-to-end solution with BlueField as well as our Spectrum switch that allows us to perform some of the capabilities that we have in InfiniBand, not all, but some, and we achieve excellent results."}, {"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2023-11-21T00:00:00+00:00", "ai_category": 6, "ai_category_label": "Product Roadmap", "ai_materiality_score": 8, "ai_saliency_score": 3, "snippet": "You know, the team recently announced a more aggressive new product cadence in Data Center from two years to now every year, with higher levels of segmentation, training, optimization, inferencing, CPU, GPU, DPU, networking.  How do we think about your R&D OpEx growth outlook to...", "full_text": "You know, the team recently announced a more aggressive new product cadence in Data Center from two years to now every year, with higher levels of segmentation, training, optimization, inferencing, CPU, GPU, DPU, networking.\n\nHow do we think about your R&D OpEx growth outlook to support a more aggressive and expanding forward roadmap?\n\nBut more importantly, what is the team doing to manage and drive execution through all of this complexity?\n\n### Jensen Huang (Founder, President, and CEO, NVIDIA)\n\nGosh, you know, boy, that, that's just really excellent.\n\nYou just wrote NVIDIA's business plan, and you described our strategy.\n\nFirst of all, there is a fundamental reason why we accelerate our execution, and the reason for that is because it fundamentally drives down cost.\n\nWhen the combination of TensorRT-LLM and H200 reduced the cost for our customers for large model inference by a factor of four.\n\nAnd so that includes, of course, our speeds and feeds, but mostly it's because of our software, mostly the software benefits because of the, because of the architecture.\n\nAnd so we want to accelerate our roadmap for that reason.\n\nThe second reason is to expand the reach of generative AI.\n\nThe world's number of Data Center configurations, this is kind of the amazing thing.\n\nYou know, NVIDIA is in every cloud, but not one cloud is the same.\n\nNVIDIA is working with every single cloud service provider, and not one of their networking, control plane, security posture is the same.\n\nEverybody's platform is different, and yet we're integrated into all of their stacks, all of their Data Centers, and we work incredibly well with all of them.\n\nAnd not to mention, we then take the whole thing and we create AI factories that are standalone.\n\nWe take our platform, we can put them into supercomputers, we can put them into enterprise."}, {"ticker": "MU", "sub_type": "earnings_call", "publication_date": "2024-03-20T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 8, "ai_saliency_score": 3, "snippet": "The increase from first quarter of a percent to 20% in the second quarter was dominantly price.  And obviously, a lot of other things going on, but the dominant feature of that increase was price.  Likewise, in the 20% second quarter actuals to the 26.5 guide, price remains the...", "full_text": "The increase from first quarter of a percent to 20% in the second quarter was dominantly price.\n\nAnd obviously, a lot of other things going on, but the dominant feature of that increase was price.\n\nLikewise, in the 20% second quarter actuals to the 26.5 guide, price remains the largest contributor.\n\nAnd offsetting part of that is, of course, what C.J. mentioned on the benefit of those lower-cost inventories fade away.\n\nBut price is still the largest factor.\n\nBut what begins to come in are both resumption of cost downs.\n\nAnd then we're starting to see some favorable mix effects for the products that Sanjay talked about, including HBM.\n\nThen as we move into the fourth quarter, where we would expect a margin increase comparable to the levels that we saw second to third quarter, that becomes more balanced between price effects and product mix effects and cost downs.\n\nAnd most notably, HBM begins to become more material.\n\nAnd that would then proceed into 2025.\n\nAs we look in 2025, we see continued pricing strength in 2025.\n\nWe see favorable product mix in 2025.\n\nAnd then our cost downs, excluding the HBM effects, we expect to have good cost downs, all contributing to margin expansion.\n\n### Brian Chin (Director and Senior Equity Research Analyst, Stifel)\n\nOkay.\n\nThank you.\n\nVery helpful.\n\n### Operator\n\nThank you.\n\nOne moment for our next question.\n\nFor our last question for today comes from the line of Chris Danely from Citi.\n\nYour question, please.\n\n### Chris Danely (Stock Analyst, Citi)\n\nHey.\n\nThanks, guys.\n\nI guess just another multi-part question on margins like everybody else.\n\nSo you mentioned that there's still some underutilization charges related to legacy manufacturing capacity.\n\nWhen do those go away?\n\nAnd then as a follow-up to all these HBM margin questions, can you just talk about the gross margin arc of your HBM products as more competition and capacity comes onto the market?"}, {"ticker": "DELL", "sub_type": "earnings_call", "publication_date": "2025-02-27T00:00:00+00:00", "ai_category": 2, "ai_category_label": "Operational Efficiencies", "ai_materiality_score": 7, "ai_saliency_score": 3, "snippet": "And if I think about the growth in the P&L, that will throw off good cash.  So look, I think we feel pretty good about cash.  I do expect it to be greater than one times.  And so yeah.  And then to your second question, I probably won't give you as much detail as you like...", "full_text": "And if I think about the growth in the P&L, that will throw off good cash.\n\nSo look, I think we feel pretty good about cash.\n\nI do expect it to be greater than one times.\n\nAnd so yeah.\n\nAnd then to your second question, I probably won't give you as much detail as you like because we think some of the changes we're making are very proprietary and differentiating us in the market, the fact that we can grow while reducing our operating expenditures.\n\nBut Yvonne hit on it, Amit.\n\nSimplify, standardize, automate.\n\nWe are building a new company.\n\nWe are what we call modernizing it.\n\nWe made reference to modernization.\n\nIf you prefer, we're future-proofing the company, and we're systematically going throughout all of the value streams in the company, and we are modernizing the work, the workflows, taking steps out of processes, taking out manual touches, simplifying and standardizing those processes, applying automation and the very technologies that we've talked about that get us excited in this marketplace, which is why we believe this AI thing makes its way to enterprise.\n\nWe are deploying AI in the enterprise.\n\nThe broad categories of use cases are industry-known, whether that's content creation and management, support assistance, natural language search, design and data creation, code generation, or document automation.\n\nThose are broad enterprise use cases.\n\nWe are deploying those types of technologies inside our company and seeing tremendous efficiency from that.\n\nAnd it is durable.\n\nIt's not a one-timer.\n\n### Yvonne McGill (CFO, Dell Technologies)\n\nWhat's so exciting is we're making all these changes.\n\nWe're making investments, but we're driving all of this efficiency to enable that.\n\nSo the net, what you're seeing us guide to is lower spend, but it's because we're driving all of these efficiencies that will enable us to invest while spending less.\n\n### Jeff Clarke (Vice Chairman and COO, Dell Technologies)\n\nI think that's very important."}, {"ticker": "MU", "sub_type": "earnings_call", "publication_date": "2024-03-20T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 9, "ai_saliency_score": 3, "snippet": "You mentioned fiscal year 2024, you're down low double digits.  Is your wafer capacity likely to be down again in fiscal 2025?  Thank you.  ### Sanjay Mehrotra (President and CEO, Micron Technology)  So HBM3E, first of all, it's a great product, as I mentioned, well-received by...", "full_text": "You mentioned fiscal year 2024, you're down low double digits.\n\nIs your wafer capacity likely to be down again in fiscal 2025?\n\nThank you.\n\n### Sanjay Mehrotra (President and CEO, Micron Technology)\n\nSo HBM3E, first of all, it's a great product, as I mentioned, well-received by our customers, high performance, and 30% lower power than any other product that's out there.\n\nSo of course, it has strong demand.\n\nAs we have highlighted, we are sold out for our calendar year 2024 supply, and our calendar year 2025 supply is also mostly vast majority is already allocated.\n\nWe have just begun production shipments, and these will continue to increase through the course of calendar year 2024 as well as continue to increase through calendar year 2025.\n\nWe are continuing to work on increasing our capacity and making good progress with respect to capacity as well as overall yield and quality.\n\nSo certainly, in calendar year 2025 versus calendar year 2024, given that we are just starting our production here now, there'll certainly be a significant growth over our calendar year 2024 numbers.\n\nAnd you can look at it same way for fiscal 2024 versus 2025.\n\nSo it will be definitely a significant increase with us achieving our share in HBM in line with our industry share sometime in calendar 2025.\n\nI'm not in a position to spell it out exactly for you in terms of what is the volume increase, but certainly, HBM, with our strong product position, it will be a strong driver of revenue growth fiscal year 2024 fiscal year 2025 over fiscal year 2024.\n\nRegarding the wafer capacity, by end of this fiscal year, we have said low double-digit structural reduction in capacity.\n\nOf course, we will be managing this capacity in fiscal year 2024, keeping in mind our focus on supply-demand discipline, staying extremely disciplined with respect to supply growth, staying extremely disciplined with respect to our HBM share as well, and managing our technology transitions as we go through the year."}], "saliency_bottom": [{"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2022-08-24T00:00:00+00:00", "ai_category": 4, "ai_category_label": "Clear Positive", "ai_materiality_score": 5, "ai_saliency_score": -2, "snippet": "You can find a reconciliation of these non-GAAP financial measures to GAAP financial measures in our CFO commentary, which is posted on our website.  With that, let me turn the call over to Colette.  ### Colette Kress (EVP and CFO, NVIDIA)  Thanks, Simona.  This was a...", "full_text": "You can find a reconciliation of these non-GAAP financial measures to GAAP financial measures in our CFO commentary, which is posted on our website.\n\nWith that, let me turn the call over to Colette.\n\n### Colette Kress (EVP and CFO, NVIDIA)\n\nThanks, Simona.\n\nThis was a challenging quarter.\n\nTotal revenue of $6.7 billion was down 19% sequentially and up 3% year-on-year, below the $8.1 billion outlook we provided on our last earnings call.\n\nAs we'd indicated in our pre-announcement press release on 8th August , we experienced a shortfall to our expectations, driven primarily by weaker gaming revenue.\n\nToday, we will share with you more details on our Q2 results and Q3 outlook.\n\nStarting with gaming.\n\nRevenue of $2.04 billion was down 44% sequentially and down 33% year-on-year, reflecting challenging market conditions.\n\nAs discussed in May, we expected a sequential decline in gaming revenue due to softness in Europe related to the war in Ukraine and COVID lockdowns in China.\n\nThe decline in gaming GPU revenue was sharper than anticipated, driven by both lower units and lower ASPs.\n\nMacroeconomic headwinds across the world drove a sudden slowdown in consumer demand.\n\nWe implemented programs with our gaming channel partners to adjust pricing in the channel and to price position current high-end desktop GPUs as we prepare for a new architecture launch.\n\nAs noted last quarter, we had expected cryptocurrency mining to make a diminishing contribution to gaming demand.\n\nWe are unable to accurately quantify the extent to which reduced crypto mining contributed to the decline in gaming demand.\n\nWhile gaming navigates significant short-term macroeconomic challenges, we believe the long-term fundamentals in gaming remain strong.\n\nNVIDIA RTX has redefined computer graphics and is now supported by almost 300 games and applications.\n\nNVIDIA's GeForce GPUs are the most coveted brand by gamers, representing 15 of the top 15 most popular GPUs on Steam."}, {"ticker": "INTC", "sub_type": "earnings_call", "publication_date": "2024-08-01T00:00:00+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 8, "ai_saliency_score": -2, "snippet": "### David Zinsner (CFO, Intel)  Thank you, Pat, and good afternoon, everyone.  Second quarter revenue was $12.8 billion, down 1% year-over-year and up 1% sequentially.  Revenue was in line with the range we provided in May after receiving notice of an export license restriction,...", "full_text": "### David Zinsner (CFO, Intel)\n\nThank you, Pat, and good afternoon, everyone.\n\nSecond quarter revenue was $12.8 billion, down 1% year-over-year and up 1% sequentially.\n\nRevenue was in line with the range we provided in May after receiving notice of an export license restriction, which negatively impacted our client business in China.\n\nIntel Products and Intel Foundry both delivered 4% year-over-year growth, offset by headwinds in our more cyclical businesses.\n\nProfitability was significantly more challenged versus our previous expectations, with Q2 gross margin of 38.7% and EPS of $0.02.\n\nWeaker-than-expected gross margin was due to three main drivers.\n\nThe largest impact was caused by an accelerated ramp of our AI PC product.\n\nIn addition to exceeding expectations on Q2 Core Ultra shipments, we made the decision to accelerate transition of Intel 4 and 3 wafers from our development fab in Oregon to our high-volume facility in Ireland, where wafer costs are higher in the near term.\n\nHowever, this change resulted in approximately $1 billion of capital savings and will improve Intel 4 and 3 gross margin long term as we scale up the Ireland fab.\n\nMargins were also impacted by higher-than-typical period charges related to non-core businesses and charges associated with unused capacity.\n\nFinally, we saw an unfavorable product mix and more competitive pricing than expected.\n\nQ2 operating cash flow was $2.3 billion, up approximately $3.5 billion sequentially on better working capital.\n\nGross CapEx of $5.7 billion was more than offset by $11.5 billion in grants and partner contributions, highlighted by Apollo's SCIP investment in our Ireland factory operations, resulting in adjusted free cash flow of $8.2 billion.\n\nIntel products revenue was $11.8 billion, up 4% year-over-year.\n\nThe client business grew 9% year-over-year as the AI PC ramp contributed to higher volume and ASPs, partially offset by export license restrictions communicated during the quarter."}, {"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2022-11-16T00:00:00+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 6, "ai_saliency_score": -2, "snippet": "If you can clarify what was in those charges.  In general, for your internal inventory, does that still need to be worked down?  What are the implications if that needs to be worked down over the next couple of quarters?  ### Colette Kress (EVP and CFO, NVIDIA)  Thanks for the...", "full_text": "If you can clarify what was in those charges.\n\nIn general, for your internal inventory, does that still need to be worked down?\n\nWhat are the implications if that needs to be worked down over the next couple of quarters?\n\n### Colette Kress (EVP and CFO, NVIDIA)\n\nThanks for the question, Chris.\n\nAs we highlighted in our prepared remarks, we booked an entry of $702 million for inventory reserves within the quarter.\n\nMost of that, primarily all of it, is related to our data center business.\n\nJust due to the change in expected demand looking forward for China.\n\nWhen we look at the data center products, a good portion of this was also the A100, which we wrote down.\n\nNow, looking at our inventory that we have on hand and the inventory that has increased, a lot of that is just due to our upcoming architectures coming to market.\n\nOur Ada architecture, our Hopper architecture, and even more in terms of our networking business.\n\nWe have been building for those architectures to come to market, and that's what you see.\n\nWe are always looking at our inventory levels at the end of each quarter for our expected demand going forward.\n\nI think we've done a solid job at least in this quarter, just based on that expectation going forward.\n\n### Operator\n\nYour next question comes from the line of Timothy Arcuri with UBS.\n\nYour line is now open.\n\n### Timothy Arcuri (Managing Director, UBS)\n\nThanks a lot.\n\nColette, I have a you know two-part question.\n\nFirst, is there any effect of stockpiling in the data center guidance?\n\nI ask because you now have the A800 that's sort of a modified version of the A100 with a lower data transfer rate.\n\nSo one could imagine that customers might be stocking that while they can still get it.\n\nI guess the second part of that is related to the inventory charge.\n\nCan you just go into that a little bit more?\n\nBecause last quarter it made sense that you took a charge because you know revenue was less than you thought."}, {"ticker": "NVDA", "sub_type": "earnings_call", "publication_date": "2022-11-16T00:00:00+00:00", "ai_category": 5, "ai_category_label": "Clear Negative", "ai_materiality_score": 6, "ai_saliency_score": -2, "snippet": "Can you just go into that a little bit more?  Because last quarter it made sense that you took a charge because you know revenue was less than you thought.  Revenue came in pretty much in line, and it sounded like China was a net neutral.  Is the charge related to just, you...", "full_text": "Can you just go into that a little bit more?\n\nBecause last quarter it made sense that you took a charge because you know revenue was less than you thought.\n\nRevenue came in pretty much in line, and it sounded like China was a net neutral.\n\nIs the charge related to just, you know, working A100 inventory down faster?\n\nIs that what the charge is related to?\n\nThanks.\n\n### Colette Kress (EVP and CFO, NVIDIA)\n\nSure.\n\nLet me talk about the first statement that you indicated.\n\nMost of our data center business that we see is we're working with customers specifically on their needs to build out accelerated computing and AI.\n\nIt's just not a business in terms of where units are being held for that.\n\nThey're usually for very specific products and projects that we see.\n\nI'm gonna answer no, nothing that we can see.\n\nYour second question regarding the inventory provisions.\n\nAt the end of last quarter, we were beginning to see softness in China.\n\nWe have always been looking at our needs long term.\n\nIt's not a statement about the current quarter in inventory, as you can see.\n\nIt usually takes two or three quarters for us to build product for the future demand.\n\nThat's always a case of the inventory that we are ordering.\n\nNow looking at what we've seen in terms of continued lockdowns, continued economy challenges in China, it was time for us to take a hard look of what do we think we'll need for data center going forward, and that led to our write-downs.\n\n### Operator\n\nYour next question comes from the line of Stacy Rasgon with Bernstein.\n\nYour line is now open.\n\n### Stacy Rasgon (Managing Director and Senior Analyst, Bernstein)\n\nHi, guys.\n\nThanks for taking my question.\n\nColette, I had a question on the commentary you gave on the sequentials.\n\nIt kinda sounded like data center maybe had some China softness issues.\n\nYou said gaming resuming sequential growth, but then you said sequen
